<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduScan - Realtime Dynamic QR Attendance</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5 QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- Reliable QRCode.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-fast { animation: pulse-fast 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

    @media print {
      body * { visibility: hidden; }
      #printable-report-area, #printable-report-area * { visibility: visible; }
      #printable-report-area { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none no-print"></div>

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6-1v2M6 4v2M4 8h16M4 16h16M6 20v-2m12 2v-2m-6 2v-1M8 12h8" /></svg>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="font-bold text-lg text-slate-900 leading-tight">EduScan</h1>
              <span id="cloud-status-badge" class="px-2 py-0.5 text-[10px] font-bold bg-amber-100 text-amber-800 rounded-full flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse-fast"></span>Connecting Cloud...
              </span>
            </div>
            <p class="text-xs text-slate-500 font-medium">Cloud Attendance System</p>
          </div>
        </div>
        <nav class="hidden md:flex space-x-1" id="desktop-nav-slot"></nav>
        <div id="auth-header-slot"></div>
      </div>
    </div>
    <div class="md:hidden flex overflow-x-auto border-t border-slate-200 px-2 py-1.5 space-x-1 scrollbar-none" id="mobile-nav-slot"></div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8" id="main-content">
    <div class="text-center mt-20 text-slate-500">Loading Workspace...</div>
  </main>

  <div id="modal-container" class="no-print"></div>
  <div id="bulk-action-bar" class="fixed bottom-0 inset-x-0 bg-white border-t shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] p-4 transform translate-y-full transition-transform duration-300 z-40 hidden flex justify-between items-center max-w-7xl mx-auto no-print"></div>

  <!-- CONSOLIDATED REALTIME CLOUD ENGINE -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getDatabase, ref, onValue, set } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

    const DEPARTMENTS = ['First Year (FE)', 'Computer Science', 'Information Tech', 'Electronics Eng', 'Mechanical Eng', 'Civil Eng', 'Management'];
    const YEARS = ['FE', 'SE', 'TE', 'BE'];
    const DEPT_DIVISIONS = ['A', 'B', 'C', 'D'];
    const FE_DIVISIONS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K'];

    const DEFAULT_USERS = [
      { id: 'usr_admin', username: 'admin', password: 'admin123', name: 'System Administrator', role: 'ADMIN' },
      { id: 'usr_hod', username: 'hod_cs', password: 'hod123', name: 'Dr. HOD CS', role: 'HOD' },
      { id: 'usr_fac', username: 'prof_smith', password: 'smith123', name: 'Prof. Smith', role: 'FACULTY' },
      { id: 'usr_view', username: 'viewer', password: 'view123', name: 'Observer Officer', role: 'VIEW_ONLY' }
    ];

    function getStoredFallback() {
      const keys = ['eduscan_cache_state', 'appStateFinalQR', 'eduscan_state', 'appState'];
      for (let k of keys) {
        let raw = localStorage.getItem(k);
        if (raw) {
          try {
            let parsed = JSON.parse(raw);
            if (parsed && (parsed.students?.length || parsed.lectures?.length)) return parsed;
          } catch(e){}
        }
      }
      return null;
    }

    const fallbackData = getStoredFallback();

    window.state = {
      students: fallbackData?.students || [],
      users: fallbackData?.users?.length ? fallbackData.users : DEFAULT_USERS,
      lectures: fallbackData?.lectures || [],
      attendance: fallbackData?.attendance || [],
      coordinators: fallbackData?.coordinators || [],
      usedQrTokens: fallbackData?.usedQrTokens || [],
      currentUser: JSON.parse(localStorage.getItem('eduscan_session')) || null,
      activeTab: 'lectures'
    };

    window.selectedStudents = new Set();
    window.currentReportType = 'Theory';
    window.currentActiveLectureId = null;
    let qrRefreshInterval = null, html5QrCode = null, isScanningPaused = false;
    let database = null, stateRef = null;

    try {
      const app = initializeApp({
        apiKey: 'AIzaSyCBWbzAn4-n1pD9RAgZkD-djb4-5VmP9mU',
        authDomain: 'attengo-e1c2c.firebaseapp.com',
        projectId: 'attengo-e1c2c',
        databaseURL: 'https://attengo-e1c2c-default-rtdb.asia-southeast1.firebasedatabase.app',
        storageBucket: 'attengo-e1c2c.firebasestorage.app'
      });
      database = getDatabase(app);
      stateRef = ref(database, 'appStateFinalQR');

      onValue(stateRef, (snapshot) => {
        const cloudData = snapshot.val();
        if (cloudData) {
          if (cloudData.students?.length) window.state.students = cloudData.students;
          if (cloudData.users?.length) window.state.users = cloudData.users;
          if (cloudData.lectures?.length) window.state.lectures = cloudData.lectures;
          if (cloudData.attendance?.length) window.state.attendance = cloudData.attendance;
          if (cloudData.coordinators?.length) window.state.coordinators = cloudData.coordinators;
          if (cloudData.usedQrTokens?.length) window.state.usedQrTokens = cloudData.usedQrTokens;

          localStorage.setItem('eduscan_cache_state', JSON.stringify({
            students: window.state.students,
            users: window.state.users,
            lectures: window.state.lectures,
            attendance: window.state.attendance,
            coordinators: window.state.coordinators,
            usedQrTokens: window.state.usedQrTokens
          }));
        } else if (window.state.students.length > 0) {
          window.saveStateLocalAndCloud();
        }

        window.setCloudStatus('Cloud Sync: Active', true);

        if (window.currentActiveLectureId && document.getElementById('lecture-scan-count-badge')) {
          window.updateLiveLectureView();
        } else if (document.getElementById('student-portal-wrapper')) {
          window.updateStudentPortalStats();
        } else if (window.state.activeTab === 'students' && document.getElementById('student-grid-container')) {
          window.filterStudentsList();
        } else if (window.state.activeTab === 'reports' && document.getElementById('report-table-container')) {
          window.generateReportTable();
        } else if (window.state.activeTab === 'lectures' && document.getElementById('lecture-grid-container')) {
          window.filterLecturesList();
        } else {
          window.renderMainContent();
        }
      }, (err) => {
        window.setCloudStatus('Offline (Local)', false);
        if (!window.currentActiveLectureId) window.renderMainContent();
      });

    } catch (e) {
      window.setCloudStatus('Offline (Local)', false);
      window.renderMainContent();
    }

    window.saveStateLocalAndCloud = async function() {
      if (window.state.currentUser) localStorage.setItem('eduscan_session', JSON.stringify(window.state.currentUser));
      else localStorage.removeItem('eduscan_session');

      const dataSnapshot = {
        students: window.state.students,
        users: window.state.users,
        lectures: window.state.lectures,
        attendance: window.state.attendance,
        coordinators: window.state.coordinators,
        usedQrTokens: (window.state.usedQrTokens || []).slice(-500)
      };

      localStorage.setItem('eduscan_cache_state', JSON.stringify(dataSnapshot));

      if (database && stateRef) {
        try {
          await set(stateRef, JSON.parse(JSON.stringify(dataSnapshot)));
          window.setCloudStatus('Cloud Sync: Active', true);
        } catch(e) {
          window.setCloudStatus('Offline (Local)', false);
        }
      }
    };

    window.getDivisionsForYear = function(year) {
      return year === 'FE' ? FE_DIVISIONS : DEPT_DIVISIONS;
    };

    window.setCloudStatus = function(message, isOnline) {
      const badge = document.getElementById('cloud-status-badge');
      if (!badge) return;
      badge.className = `px-2 py-0.5 text-[10px] font-bold rounded-full flex items-center gap-1 ${isOnline ? 'bg-teal-100 text-teal-800' : 'bg-rose-100 text-rose-800'}`;
      badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${isOnline ? 'bg-teal-500 animate-pulse-fast' : 'bg-rose-500'}"></span>${message}`;
    };

    window.showToast = function(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `flex items-center px-4 py-3 rounded-xl shadow-lg border text-sm font-bold z-50 ${type === 'success' ? 'bg-teal-600 text-white' : type === 'error' ? 'bg-rose-600 text-white' : 'bg-indigo-600 text-white'}`;
      toast.innerHTML = `<span class="mr-2">${type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ'}</span> ${message}`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
    };

    window.getModalContainer = function() {
      let c = document.getElementById('modal-container');
      if (!c) { c = document.createElement('div'); c.id = 'modal-container'; document.body.appendChild(c); }
      return c;
    };

    window.closeModal = function() {
      const c = document.getElementById('modal-container');
      if (c) c.innerHTML = '';
    };

    window.cleanupHardware = function() {
      if (qrRefreshInterval) clearInterval(qrRefreshInterval);
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => html5QrCode.clear()).catch(e => console.error(e));
      }
      isScanningPaused = false;
      window.currentActiveLectureId = null;
    };

    window.switchTab = function(tab) {
      window.cleanupHardware();
      if (!window.state.currentUser) { window.openLoginModal(); return; }
      window.state.activeTab = tab;
      window.selectedStudents.clear();
      window.updateBulkActionBar();
      window.renderMainContent();
    };

    window.renderNavigation = function() {
      const desktopNav = document.getElementById('desktop-nav-slot');
      const mobileNav = document.getElementById('mobile-nav-slot');
      if (!window.state.currentUser) { desktopNav.innerHTML = `<span class="text-xs text-slate-400 font-semibold">🔒 Log in required</span>`; mobileNav.innerHTML = ``; return; }

      if (window.state.currentUser.role === 'STUDENT') {
        desktopNav.innerHTML = `<button onclick="window.switchTab('portal')" class="px-3 py-2 bg-indigo-50 text-indigo-700 rounded-lg text-sm font-bold">📊 My Portal</button>`;
        mobileNav.innerHTML = `<button onclick="window.switchTab('portal')" class="px-3 py-1.5 bg-indigo-600 text-white rounded-md text-xs font-semibold">My Portal</button>`;
        return;
      }

      const isAdminOrHod = (window.state.currentUser.role === 'ADMIN' || window.state.currentUser.role === 'HOD');

      const tabs = [
        { id: 'lectures', icon: '📖', label: 'Lectures' },
        { id: 'students', icon: '👨‍🎓', label: 'Students' },
        { id: 'reports', icon: '📈', label: 'Reports' },
        ...(isAdminOrHod ? [{ id: 'coordinators', icon: '🎓', label: 'Coordinators' }] : []),
        { id: 'settings', icon: '⚙️', label: 'Settings' }
      ];
      desktopNav.innerHTML = tabs.map(t => `<button onclick="window.switchTab('${t.id}')" class="px-3 py-2 rounded-lg text-sm font-medium ${window.state.activeTab === t.id ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600'}">${t.icon} ${t.label}</button>`).join('');
      mobileNav.innerHTML = tabs.map(t => `<button onclick="window.switchTab('${t.id}')" class="px-3 py-1.5 rounded-md text-xs font-medium text-slate-600 ${window.state.activeTab === t.id ? 'bg-indigo-100 text-indigo-800' : ''}">${t.label}</button>`).join('');
    };

    window.renderAuthHeader = function() {
      const slot = document.getElementById('auth-header-slot');
      if (window.state.currentUser) {
        const coordAssignment = window.state.coordinators.find(c => c.username === window.state.currentUser.username);
        const coordTag = coordAssignment ? `<span class="px-1.5 py-0.5 text-[9px] font-bold rounded bg-purple-100 text-purple-800">Coordinator (${coordAssignment.year}-${coordAssignment.division})</span>` : '';

        slot.innerHTML = `<div class="flex items-center gap-3"><div class="text-right hidden sm:block"><p class="text-xs font-semibold text-slate-900">${window.state.currentUser.name}</p><div class="flex items-center gap-1 justify-end">${coordTag}<span class="px-1.5 py-0.5 text-[10px] font-bold rounded bg-slate-100">${window.state.currentUser.role}</span></div></div><button onclick="window.handleLogout()" class="px-3 py-1.5 bg-rose-50 text-rose-600 rounded-lg text-xs font-bold hover:bg-rose-100">Logout</button></div>`;
      } else {
        slot.innerHTML = `<button onclick="window.openLoginModal()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm font-medium">Log In</button>`;
      }
    };

    window.handleLogout = function() {
      window.cleanupHardware();
      window.state.currentUser = null;
      localStorage.removeItem('eduscan_session');
      window.openLoginModal();
      window.renderNavigation();
      window.renderAuthHeader();
    };

    window.renderMainContent = function() {
      window.renderNavigation();
      window.renderAuthHeader();
      const main = document.getElementById('main-content');
      if (!window.state.currentUser) { main.innerHTML = `<div class="text-center mt-20"><h2 class="text-2xl font-bold text-slate-900">EduScan</h2><button onclick="window.openLoginModal()" class="mt-4 px-6 py-2 bg-indigo-600 text-white rounded-xl font-bold shadow-md">Open Login Portal</button></div>`; return; }
      if (window.state.currentUser.role === 'STUDENT') { window.renderStudentPortalView(main); return; }
      switch (window.state.activeTab) {
        case 'lectures': window.renderLecturesView(main); break;
        case 'students': window.renderStudentsView(main); break;
        case 'reports': window.renderReportsView(main); break;
        case 'coordinators': window.renderCoordinatorsView(main); break;
        case 'settings': window.renderSettingsView(main); break;
        default: window.renderLecturesView(main);
      }
    };

    window.updateDivOptionsForYear = function(yearSelectId, divSelectId) {
      const yr = document.getElementById(yearSelectId).value;
      const divSelect = document.getElementById(divSelectId);
      if(!divSelect) return;
      const divs = window.getDivisionsForYear(yr);
      divSelect.innerHTML = divs.map(d => `<option value="${d}">Div ${d}</option>`).join('');
    };

    window.updateBatchOptions = function(divSelectId, batchSelectId, includeNoChange = false) {
      const div = document.getElementById(divSelectId).value;
      const batchSelect = document.getElementById(batchSelectId);
      if(!batchSelect) return;
      let opts = includeNoChange ? `<option value="">-- No Change --</option>` : '';
      if(div) {
        opts += `<option value="Full">Full Division</option>
                 <option value="${div}1">${div}1</option>
                 <option value="${div}2">${div}2</option>
                 <option value="${div}3">${div}3</option>`;
      } else {
        opts += `<option value="Full">Full Division</option>`;
      }
      batchSelect.innerHTML = opts;
    };

    window.computeStudentStats = function(moodleId) {
      const s = window.state.students.find(x => String(x.moodleId) === String(moodleId));
      if(!s) return { attended: 0, total: 0, pct: 100, statusBadge: '' };
      const relLecs = window.state.lectures.filter(l => l.year === s.year && l.division === s.division && (l.batch === 'Full' || l.batch === s.batch));
      const total = relLecs.length;
      if(total === 0) return { attended: 0, total: 0, pct: 100, statusBadge: '<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-slate-100 text-slate-700">No Sessions</span>' };
      const relIds = relLecs.map(l => l.id);
      const attended = window.state.attendance.filter(a => String(a.moodleId) === String(moodleId) && relIds.includes(a.lectureId)).length;
      const pct = Math.min(100, Math.round((attended / total) * 100));

      let statusBadge = '';
      if (pct >= 75) {
        statusBadge = '<span class="px-2.5 py-1 text-xs font-extrabold rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300">🟢 Safe (Eligible)</span>';
      } else if (pct >= 60) {
        statusBadge = '<span class="px-2.5 py-1 text-xs font-extrabold rounded-full bg-amber-100 text-amber-800 border border-amber-300">🟡 Warning (Borderline)</span>';
      } else {
        statusBadge = '<span class="px-2.5 py-1 text-xs font-extrabold rounded-full bg-rose-100 text-rose-800 border border-rose-300">🔴 Defaulter</span>';
      }
      return { attended, total, pct, statusBadge };
    };

    // --- 1. LECTURES & QR DISPLAY ---
    window.renderLecturesView = function(c) {
      const isViewOnly = window.state.currentUser.role === 'VIEW_ONLY';
      const isFaculty = window.state.currentUser.role === 'FACULTY';

      c.innerHTML = `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl border shadow-xs">
            <div><h2 class="text-2xl font-bold text-slate-900">Lecture Sessions</h2><p class="text-slate-500 text-sm">Create lectures/labs and display dynamic live QR codes.</p></div>
            <div class="flex flex-wrap gap-2">
              ${isFaculty ? `<button onclick="window.exportSubjectTeacherCSV()" class="px-4 py-2.5 bg-teal-600 text-white font-bold rounded-xl text-sm shadow-sm flex items-center gap-1">📊 Export My Subject CSV</button>` : ''}
              ${!isViewOnly ? `<button onclick="window.openCreateLectureModal()" class="px-5 py-2.5 bg-indigo-600 text-white font-semibold rounded-xl text-sm">+ Create Lecture/Lab</button>` : `<span class="px-3 py-1 bg-slate-100 text-slate-600 font-bold text-xs rounded-lg">View Only Mode</span>`}
            </div>
          </div>

          <div class="bg-white p-4 rounded-2xl border shadow-xs grid grid-cols-1 sm:grid-cols-4 gap-3">
            <input id="lec-filter-search" type="text" oninput="window.filterLecturesList()" placeholder="Search Subject / Faculty / Time..." class="px-3 py-2 bg-slate-50 border rounded-xl text-xs" />
            <select id="lec-filter-dept" onchange="window.filterLecturesList()" class="px-3 py-2 bg-slate-50 border rounded-xl text-xs">
              <option value="">All Departments</option>
              ${DEPARTMENTS.map(d => `<option value="${d}">${d}</option>`).join('')}
            </select>
            <select id="lec-filter-year" onchange="window.filterLecturesList(); window.updateDivOptionsForYear('lec-filter-year', 'lec-filter-div');" class="px-3 py-2 bg-slate-50 border rounded-xl text-xs">
              <option value="">All Years</option>
              ${YEARS.map(y => `<option value="${y}">${y}</option>`).join('')}
            </select>
            <select id="lec-filter-div" onchange="window.filterLecturesList()" class="px-3 py-2 bg-slate-50 border rounded-xl text-xs">
              <option value="">All Divisions</option>
              ${FE_DIVISIONS.map(d => `<option value="${d}">Division ${d}</option>`).join('')}
            </select>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="lecture-grid-container"></div>
        </div>
      `;
      window.filterLecturesList();
    };

    window.exportSubjectTeacherCSV = function() {
      const myUsername = window.state.currentUser.username;
      const myLectures = window.state.lectures.filter(l => l.facultyUsername === myUsername);
      if(myLectures.length === 0) return window.showToast("No lectures found created by you.", "error");

      const subjectName = myLectures[0].subject;
      let csv = `Attendance Export for Subject: ${subjectName} (Faculty: ${window.state.currentUser.name})\n`;
      csv += "Roll No,Moodle ID,Name,Department,Year,Division,Batch,Total Conducted,Attended,Percentage\n";

      window.state.students.forEach(s => {
        const relLecs = myLectures.filter(l => l.year === s.year && l.division === s.division && (l.batch === 'Full' || l.batch === s.batch));
        if(relLecs.length > 0) {
          const lecIds = relLecs.map(l => l.id);
          const atts = window.state.attendance.filter(a => String(a.moodleId) === String(s.moodleId) && lecIds.includes(a.lectureId)).length;
          const pct = Math.min(100, Math.round((atts / relLecs.length) * 100));
          csv += `"${s.rollNo || ''}","${s.moodleId}","${s.name}","${s.department}","${s.year}","${s.division}","${s.batch}",${relLecs.length},${atts},${pct}%\n`;
        }
      });

      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
      a.download = `${subjectName}_Subject_Attendance.csv`; a.click();
    };

    window.filterLecturesList = function() {
      const search = (document.getElementById('lec-filter-search')?.value || '').toLowerCase();
      const dept = document.getElementById('lec-filter-dept')?.value || '';
      const year = document.getElementById('lec-filter-year')?.value || '';
      const div = document.getElementById('lec-filter-div')?.value || '';

      const grid = document.getElementById('lecture-grid-container');
      if (!grid) return;

      let baseLectures = window.state.lectures;
      if (window.state.currentUser.role === 'FACULTY') {
        baseLectures = window.state.lectures.filter(l => l.facultyUsername === window.state.currentUser.username);
      }

      const filtered = baseLectures.filter(l => {
        const matchesSearch = l.subject.toLowerCase().includes(search) || l.facultyName.toLowerCase().includes(search) || (l.time && l.time.includes(search));
        const matchesDept = !dept || l.department === dept;
        const matchesYear = !year || l.year === year;
        const matchesDiv = !div || l.division === div;
        return matchesSearch && matchesDept && matchesYear && matchesDiv;
      });

      const isViewOnly = window.state.currentUser.role === 'VIEW_ONLY';

      grid.innerHTML = filtered.map(l => {
        const attendedCount = window.state.attendance.filter(a => a.lectureId === l.id).length;
        const enrolledStudents = window.state.students.filter(s => s.year === l.year && s.division === l.division && (l.batch === 'Full' || s.batch === l.batch));
        const enrolledCount = enrolledStudents.length;
        const pct = enrolledCount > 0 ? Math.round((attendedCount / enrolledCount) * 100) : 0;
        const sessionType = l.sessionType || 'Theory';

        return `
          <div class="bg-white p-5 rounded-2xl border border-indigo-100 shadow-xs flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start gap-2">
                <div>

    window.handleCreateLecture = function(e) {
      e.preventDefault();
      const subject = document.getElementById('lec-subject').value.trim();
      const year = document.getElementById('lec-year').value;
      const division = document.getElementById('lec-div').value;
      const batch = document.getElementById('lec-batch').value;
      const date = document.getElementById('lec-date').value;
      const time = document.getElementById('lec-time').value;

      const existing = window.state.lectures.find(l => l.subject.toLowerCase() === subject.toLowerCase() && l.year === year && l.division === division && l.batch === batch && l.date === date && l.time === time);
      if(existing) {
        return window.showToast("Warning: A session for this subject, date & time already exists!", "error");
      }

      window.state.lectures.unshift({ 
        id: `lec_${Date.now()}`, 
        sessionType: document.getElementById('lec-session-type').value,
        subject, 
        department: document.getElementById('lec-dept').value, 
        year, 
        division, 
        batch, 
        date,
        time,
        facultyUsername: window.state.currentUser.username, 
        facultyName: window.state.currentUser.name 
      });

      window.saveStateLocalAndCloud(); window.closeModal(); window.switchTab('lectures'); window.showToast("Session created successfully!");
    };

    window.deleteLecture = function(id) {
      const lecture = window.state.lectures.find(l => l.id === id);
      if(window.state.currentUser.role === 'VIEW_ONLY') return window.showToast("View Only users cannot delete sessions.", "error");
      if(window.state.currentUser.role === 'FACULTY' && lecture && lecture.facultyUsername !== window.state.currentUser.username) {
        return window.showToast("You can only delete your own sessions.", "error");
      }

      if(confirm("Delete this session and all its attendance records?")) {
        window.state.lectures = window.state.lectures.filter(l => l.id !== id);
        window.state.attendance = window.state.attendance.filter(a => a.lectureId !== id);
        window.saveStateLocalAndCloud(); window.switchTab('lectures');
      }
    };

    // --- QR DISPLAY ---
    window.launchFacultyQRDisplay = function(lectureId) {
      window.currentActiveLectureId = lectureId;
      const lecture = window.state.lectures.find(l => l.id === lectureId);
      const c = document.getElementById('main-content');
      const isViewOnly = window.state.currentUser.role === 'VIEW_ONLY';

      c.innerHTML = `
        <div class="max-w-5xl mx-auto space-y-6">
          <div class="bg-white p-4 rounded-2xl border flex justify-between items-center shadow-xs">
            <div>
              <button onclick="window.currentActiveLectureId = null; window.switchTab('lectures')" class="text-xs text-indigo-600 font-bold mb-1">← Back</button>
              <h2 class="text-xl font-bold">${lecture.subject} <span class="text-xs font-semibold px-2 py-0.5 rounded ${lecture.sessionType === 'Lab' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800'}">${lecture.sessionType || 'Theory'}</span> <span class="text-sm font-normal text-slate-500">(${lecture.year}-${lecture.division}-${lecture.batch})</span></h2>
            </div>
            <div id="lecture-scan-count-badge" class="px-4 py-2 bg-teal-100 text-teal-800 font-bold rounded-xl text-sm">Present: 0</div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-8 rounded-2xl border shadow-lg flex flex-col items-center justify-center">
              <h3 class="font-bold text-slate-800 mb-6">Scan from Student App</h3>
              <div class="p-4 bg-white border-4 border-slate-100 rounded-3xl shadow-sm relative flex items-center justify-center w-[290px] h-[290px]">
                <div id="qr-target-box" class="flex items-center justify-center w-[250px] h-[250px]"></div>
                <div class="absolute bottom-0 left-0 h-1.5 bg-indigo-500 rounded-b-3xl" id="qr-timer-bar" style="width: 100%"></div>
              </div>
            </div>
            <div class="bg-white p-6 rounded-2xl border flex flex-col h-[450px]">
              <h3 class="font-bold text-slate-800 border-b pb-2 mb-2">Live Attendance Feed</h3>
              <div id="live-attendance-list" class="flex-1 overflow-y-auto space-y-2 mb-4"></div>
              ${!isViewOnly ? `
              <div class="pt-4 border-t border-slate-200">
                <p class="text-xs font-bold text-slate-600 mb-2">Manual Override</p>
                <div class="flex gap-2">
                  <input id="manual-moodle-id" type="text" placeholder="Enter Moodle ID" class="flex-1 px-3 py-2 border rounded-xl text-sm font-mono">
                  <button onclick="window.handleManualFacultyEntry('${lecture.id}')" class="px-4 py-2 bg-slate-800 text-white text-sm font-bold rounded-xl">Add</button>
                </div>
              </div>
              ` : ''}
            </div>
          </div>
        </div>
      `;

      let qrcodeInstance = null;

      function renderLiveQR() {
        if(!window.currentActiveLectureId || window.state.activeTab !== 'lectures') return;
        const box = document.getElementById("qr-target-box");
        if (!box) return;

        const nonce = Math.random().toString(36).substring(2, 8);
        const payload = `${lecture.id}|${Date.now()}|${nonce}`;

        try {
          if (!qrcodeInstance) {
            box.innerHTML = "";
            qrcodeInstance = new QRCode(box, {
              text: payload,
              width: 250,
              height: 250,
              colorDark: "#0f172a",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.M
            });
          } else {
            qrcodeInstance.clear();
            qrcodeInstance.makeCode(payload);
          }
        } catch(e) {
          box.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(payload)}" alt="QR Code" class="w-[250px] h-[250px] mx-auto block" />`;
        }

        const bar = document.getElementById('qr-timer-bar');
        if(bar) {
          bar.style.transition = 'none'; bar.style.width = '100%';
          setTimeout(() => { bar.style.transition = 'width 5s linear'; bar.style.width = '0%'; }, 50);
        }
      }
      
      renderLiveQR();
      qrRefreshInterval = setInterval(renderLiveQR, 5000);
      window.updateLiveLectureView();
    };

    window.handleManualFacultyEntry = function(lectureId) {
      if(window.state.currentUser.role === 'VIEW_ONLY') return window.showToast("View Only mode active.", "error");
      const moodleId = document.getElementById('manual-moodle-id').value.trim();
      const student = window.state.students.find(s => String(s.moodleId) === String(moodleId));
      if(!student) return window.showToast("Student not found", "error");
      if(window.state.attendance.find(a => a.lectureId === lectureId && String(a.moodleId) === String(moodleId))) return window.showToast("Already marked", "info");

      window.state.attendance.unshift({ 
        id: `att_${Date.now()}`, 
        lectureId, 
        moodleId, 
        studentName: student.name, 
        rollNo: student.rollNo || 9999,
        department: student.department, 
        year: student.year, 
        division: student.division, 
        batch: student.batch, 
        date: new Date().toISOString().split('T')[0], 
        time: new Date().toLocaleTimeString(), 
        status: 'Manual' 
      });
      window.saveStateLocalAndCloud(); 
      document.getElementById('manual-moodle-id').value = ''; 
      window.updateLiveLectureView(); 
      window.showToast(`${student.name} marked!`);
    };

    window.updateStudentPortalStats = function() {
      const grid = document.getElementById('student-stats-grid'), subjBars = document.getElementById('student-subject-bars'), logs = document.getElementById('student-recent-logs');
      if(!grid) return;

      const myId = window.state.currentUser.username, studentObj = window.state.students.find(s => String(s.moodleId) === String(myId)) || {};
      const relLecs = window.state.lectures.filter(l => l.year === studentObj.year && l.division === studentObj.division && (l.batch === 'Full' || l.batch === studentObj.batch));
      const stats = window.computeStudentStats(myId);

      const alertDiv = document.getElementById('student-attendance-alert');
      if (alertDiv) {
        if (stats.pct < 75) {
          alertDiv.innerHTML = `
            <div class="bg-rose-100 border border-rose-300 text-rose-800 p-4 rounded-2xl flex items-center gap-3">
              <span class="text-2xl">⚠️</span>
              <div>
                <p class="font-bold text-xs uppercase tracking-wider">Attendance Defaulter Warning</p>
                <p class="text-xs font-semibold mt-0.5">Your overall attendance is currently ${stats.pct}%, which is below the mandatory 75% cutoff.</p>
              </div>
            </div>
          `;
        } else {
          alertDiv.innerHTML = '';
        }
      }

      grid.innerHTML = `
        <div class="bg-white p-4 rounded-2xl border text-center shadow-xs">
          <span class="text-[10px] text-slate-400 font-bold uppercase">Overall Attendance</span>
          <div class="text-3xl font-black ${stats.pct >= 75 ? 'text-teal-600' : 'text-rose-600'} mt-1">${stats.pct}%</div>
        </div>
        <div class="bg-white p-4 rounded-2xl border text-center shadow-xs">
          <span class="text-[10px] text-slate-400 font-bold uppercase">Classes Attended</span>
          <div class="text-2xl font-bold text-slate-800 mt-1">${stats.attended} <span class="text-sm text-slate-400">/ ${stats.total}</span></div>
          <div class="text-[10px] text-rose-500 font-bold mt-1">Missed: ${stats.total - stats.attended}</div>
        </div>
      `;

      const subjs = {}; relLecs.forEach(l => { subjs[l.subject] = { total: (subjs[l.subject]?.total || 0) + 1, att: 0 }; });
      const myAtts = window.state.attendance.filter(a => String(a.moodleId) === String(myId));
      myAtts.forEach(a => { const l = relLecs.find(x => x.id === a.lectureId); if(l && subjs[l.subject]) subjs[l.subject].att++; });
      
      subjBars.innerHTML = Object.keys(subjs).length ? Object.keys(subjs).map(k => {
        const p = Math.round((subjs[k].att / subjs[k].total) * 100);
        return `
          <div>
            <div class="flex justify-between text-xs mb-1 font-bold">
              <span class="truncate text-slate-800">${k}</span>
              <span class="${p >= 75 ? 'text-teal-600' : 'text-rose-600'}">${subjs[k].att}/${subjs[k].total} (${p}%)</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden flex">
              <div class="${p >= 75 ? 'bg-teal-500' : 'bg-rose-500'} h-2.5 rounded-full transition-all duration-500" style="width: ${p}%"></div>
            </div>
          </div>
        `;
      }).join('') : '<p class="text-xs text-slate-400">No lectures recorded yet.</p>';

      logs.innerHTML = myAtts.slice(0, 5).map(a => {
        const lec = window.state.lectures.find(l => l.id === a.lectureId) || {};
        return `<div class="p-3 bg-slate-50 border rounded-xl text-sm flex justify-between"><div><p class="font-bold truncate w-40">${lec.subject || 'Class'}</p><p class="text-xs text-slate-400">${a.date}</p></div><span class="text-teal-600 font-bold text-xs">Present</span></div>`;
      }).join('') || '<p class="text-xs text-slate-400">No records found.</p>';
    };

    window.launchStudentQRScanner = async function() {
      const c = document.getElementById('student-camera-container'); c.classList.remove('hidden');
      html5QrCode = new Html5Qrcode("student-video-element");
      try {
        await html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: { width: 220, height: 220 } },
          (txt) => window.processStudentQRScan(txt), (err) => {}
        );
      } catch(e) {
        c.classList.add('hidden'); window.showToast("Camera blocked! Ensure site is on HTTPS and camera is allowed.", "error");
      }
    };

    window.stopStudentScanner = function() {
      if(html5QrCode && html5QrCode.isScanning) html5QrCode.stop().then(() => html5QrCode.clear()).catch(()=>{});
      document.getElementById('student-camera-container')?.classList.add('hidden');
    };

    window.processStudentQRScan = function(rawText) {
      if(isScanningPaused) return;
      isScanningPaused = true;
      const parts = String(rawText).split('|');
      
      if (parts.length < 2) { 
        window.showToast("Invalid QR Code.", "error"); 
        setTimeout(() => isScanningPaused=false, 2000); 
        return; 
      }

      const lectureId = parts[0];
      const qrTime = parseInt(parts[1], 10);
      const tokenNonce = parts[2] || '';
      const currentTime = Date.now();
      const myId = window.state.currentUser.username;
      
      const lecture = window.state.lectures.find(l => l.id === lectureId);
      if(!lecture) { 
        window.showToast("Lecture session not found.", "error"); 
        setTimeout(() => isScanningPaused=false, 2000); 
        return; 
      }

      if (Math.abs(currentTime - qrTime) > 7000) {
        window.showToast("Expired QR Code. Stored photos or late scans are blocked.", "error"); 
        setTimeout(() => isScanningPaused=false, 2000); 
        return;
      }

      const compositeToken = `${lectureId}_${qrTime}_${tokenNonce}`;
      if (tokenNonce && window.state.usedQrTokens.includes(compositeToken)) {
        window.showToast("Duplicate Token: This QR snapshot has already been consumed.", "error");
        setTimeout(() => isScanningPaused=false, 2000); 
        return;
      }

      if(window.state.attendance.find(a => a.lectureId === lectureId && String(a.moodleId) === String(myId))) {
        window.showToast("You have already marked attendance for this class.", "info"); 
        window.stopStudentScanner(); 
        return;
      }

      const studentInfo = window.state.students.find(s => String(s.moodleId) === String(myId)) || {};
      
      if(lecture.division !== studentInfo.division) {
        window.showToast(`Access Denied: This lecture is for Division ${lecture.division} only.`, "error"); 
        window.stopStudentScanner(); 
        return;
      }

      if(lecture.batch !== 'Full' && lecture.batch !== studentInfo.batch) {
        window.showToast(`Access Denied: This lecture is for Batch ${lecture.batch}.`, "error"); 
        window.stopStudentScanner(); 
        return;
      }

      let deviceLog = JSON.parse(localStorage.getItem('eduscan_device_log') || '{}');
      if (deviceLog[lectureId] && deviceLog[lectureId] !== myId) {
        window.showToast("Device locked: This physical phone was already used by another student.", "error"); 
        window.stopStudentScanner(); 
        return;
      }

      if (tokenNonce) {
        window.state.usedQrTokens.push(compositeToken);
      }

      window.state.attendance.unshift({ 
        id: `att_${Date.now()}`, 
        lectureId, 
        moodleId: myId, 
        studentName: window.state.currentUser.name, 
        rollNo: studentInfo.rollNo || 9999,
        department: studentInfo.department, 
        year: studentInfo.year, 
        division: studentInfo.division, 
        batch: studentInfo.batch, 
        date: new Date().toISOString().split('T')[0], 
        time: new Date().toLocaleTimeString(), 
        status: 'Live Dynamic QR' 
      });

      deviceLog[lectureId] = myId; 
      localStorage.setItem('eduscan_device_log', JSON.stringify(deviceLog));
      
      window.saveStateLocalAndCloud(); 
      window.stopStudentScanner(); 
      window.updateStudentPortalStats(); 
      window.showToast("Attendance Marked Successfully!");
    };

    window.exportDefaultersOnlyCSV = function() {
      let dept = document.getElementById('rpt-filter-dept')?.value || '';
      let year = document.getElementById('rpt-filter-year')?.value || 'SE';
      let div = document.getElementById('rpt-filter-div')?.value || 'A';
      const fromDate = document.getElementById('rpt-filter-from')?.value || '';
      const toDate = document.getElementById('rpt-filter-to')?.value || '';

      const coordAssignment = window.state.coordinators.find(c => c.username === window.state.currentUser.username);
      if(window.state.currentUser.role === 'FACULTY' && coordAssignment) {
        dept = coordAssignment.dept;
        year = coordAssignment.year;
        div = coordAssignment.division;
      }

      const classStudents = window.state.students.filter(s => s.year === year && s.division === div && (!dept || s.department === dept));
      let classLectures = window.state.lectures.filter(l => l.year === year && l.division === div && (!dept || l.department === dept));
      if (fromDate) classLectures = classLectures.filter(l => l.date >= fromDate);
      if (toDate) classLectures = classLectures.filter(l => l.date <= toDate);

      let csv = `OFFICIAL DEFAULTER LIST (<75% ATTENDANCE) - ${year} Div ${div}\n`;
      csv += "Roll No,Moodle ID,Email,Name,Department,Year,Division,Batch,Total Conducted,Attended,Percentage,Status\n";

      let count = 0;
      classStudents.forEach(s => {
        const validLecs = classLectures.filter(l => l.batch === 'Full' || l.batch === s.batch);
        const total = validLecs.length;
        if(total === 0) return;
        const validIds = validLecs.map(l => l.id);
        const atts = window.state.attendance.filter(a => String(a.moodleId) === String(s.moodleId) && validIds.includes(a.lectureId)).length;
        const pct = Math.min(100, Math.round((atts / total) * 100));

        if(pct < 75) {
          csv += `"${s.rollNo || ''}","${s.moodleId}","${s.email || (s.moodleId+'@apsit.edu.in')}","${s.name}","${s.department}","${s.year}","${s.division}","${s.batch}",${total},${atts},${pct}%,"DEFAULTER"\n`;
          count++;
        }
      });

      if(count === 0) return window.showToast("No defaulters found in this class!", "info");

      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
      a.download = `Defaulters_${year}_Div_${div}_${new Date().toISOString().split('T')[0]}.csv`; a.click();
      window.showToast(`Exported ${count} defaulters successfully!`);
    };

    window.triggerLowAttendanceEmailAlerts = function() {
      let dept = document.getElementById('rpt-filter-dept')?.value || '';
      let year = document.getElementById('rpt-filter-year')?.value || 'SE';
      let div = document.getElementById('rpt-filter-div')?.value || 'A';
      const fromDate = document.getElementById('rpt-filter-from')?.value || '';
      const toDate = document.getElementById('rpt-filter-to')?.value || '';

      const coordAssignment = window.state.coordinators.find(c => c.username === window.state.currentUser.username);
      if(window.state.currentUser.role === 'FACULTY' && coordAssignment) {
        dept = coordAssignment.dept;
        year = coordAssignment.year;
        div = coordAssignment.division;
      }

      const classStudents = window.state.students.filter(s => s.year === year && s.division === div && (!dept || s.department === dept));
      
      let classLectures = window.state.lectures.filter(l => l.year === year && l.division === div && (!dept || l.department === dept));
      if (fromDate) classLectures = classLectures.filter(l => l.date >= fromDate);
      if (toDate) classLectures = classLectures.filter(l => l.date <= toDate);

      if(classStudents.length === 0) return window.showToast("No students found in this class.", "error");

      const defaulterEmails = [];

      classStudents.forEach(s => {
        const validLecs = classLectures.filter(l => l.batch === 'Full' || l.batch === s.batch);
        const total = validLecs.length;
        if(total === 0) return;

        const validIds = validLecs.map(l => l.id);
        const atts = window.state.attendance.filter(a => String(a.moodleId) === String(s.moodleId) && validIds.includes(a.lectureId)).length;
        const pct = Math.min(100, Math.round((atts / total) * 100));

        if(pct < 75) {
          defaulterEmails.push(s.email || `${s.moodleId}@apsit.edu.in`);
        }
      });

      if(defaulterEmails.length === 0) {
        return window.showToast("Great news! All students in this class have attendance >= 75%.");
      }

      const subject = encodeURIComponent(`URGENT: Low Attendance Warning - ${year} Div ${div}`);
      const body = encodeURIComponent(`Dear Student,\n\nYour attendance for ${year} Division ${div} is currently below the required 75% threshold. Please meet your HOD/Class Teacher immediately.\n\nRegards,\nEduScan Attendance System\nAPSIT`);
      
      const mailtoUrl = `mailto:${defaulterEmails.join(',')}?subject=${subject}&body=${body}`;
      window.open(mailtoUrl, '_blank');

      window.showToast(`Triggered email alert to ${defaulterEmails.length} low attendance students!`);
    };

      const coordAssignment = window.state.coordinators.find(c => c.username === window.state.currentUser.username);
      if(window.state.currentUser.role === 'FACULTY' && coordAssignment) {

        year = coordAssignment.year;
        div = coordAssignment.division;
      }

      const container = document.getElementById('report-table-container');
      const cardsContainer = document.getElementById('defaulter-summary-cards');
      if (!container) return;

      const btnTheory = document.getElementById('btn-report-theory');

            </div>
            <form onsubmit="window.handleLoginSubmit(event)" class="space-y-4">
              <input id="login-username" type="text" placeholder="Username / Moodle ID" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium" />
              <input id="login-password" type="password" placeholder="Password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium" />
              <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-md transition-all">Secure Log In</button>
            </form>
          </div>
        </div>
      `;
    };

    window.handleLoginSubmit = function(e) {
      e.preventDefault();
      const uname = document.getElementById('login-username').value.trim();
      const pass = document.getElementById('login-password').value.trim();

      const student = window.state.students.find(s => String(s.moodleId) === uname);
      if (student && pass === (student.password || '123456')) {
        window.state.currentUser = { role: 'STUDENT', username: student.moodleId, name: student.name };
        window.finishLogin(student.name, 'portal'); return;
      }
      const user = window.state.users.find(u => u.username.toLowerCase() === uname.toLowerCase() && u.password === pass);
      if (user) { window.state.currentUser = user; window.finishLogin(user.name, 'lectures'); return; }
      window.showToast("Invalid credentials.", "error");
    };

    window.finishLogin = function(name, tab) {
      window.saveStateLocalAndCloud(); window.closeModal(); window.showToast(`Welcome back, ${name}!`);
      window.state.activeTab = tab; renderMainContent();
    };

    window.renderMainContent();
  </script>
</body>
</html>
